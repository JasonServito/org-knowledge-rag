[project]
name = "orgknow"
version = "0.1.0"
description = "Organizational knowledge and decision intelligence RAG over the public Kubernetes corpus."
readme = "README.md"
authors = [{ name = "Jason Servito" }]
# ADR-004 pins Python 3.12. Moving to 3.13 means amending the ADR first.
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "langfuse>=4.17.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
orgknow = "orgknow.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Ruff also formats code blocks inside Markdown by default; docs and ADRs stay hand-written.
# eval/results holds tool outputs, including the S11-R1 sitting's scratch probes (ADR-011).
extend-exclude = ["*.md", "eval/results"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear,
# UP: pyupgrade, SIM: simplify, RUF: ruff-specific rules.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# Ships with pydantic. Lets mypy know Settings() fills its fields from env vars.
plugins = ["pydantic.mypy"]

[tool.alembic]
# The database URL is not configured here: env.py reads it from Settings.
script_location = "%(here)s/src/orgknow/db/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "integration: needs real Postgres from Docker Compose",
    "reranker: loads the real reranker model; skipped when it isn't in the Hugging Face cache",
]

# torch from the PyTorch CPU index (ADR-008 D2, ADR-004 amendment 2026-10-09): PyPI's Linux wheel
# pulls ~2-3 GB of CUDA libraries. `explicit`: only torch is looked up there.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
