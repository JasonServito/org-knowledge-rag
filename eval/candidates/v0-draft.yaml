        section: Kubernetes Release Versioning > Release versioning > Supported releases and component skew
      # v1.24+: "Kubernetes releases currently happen approximately three times per year."
      # (v1.21-v1.23 said four)
      - document: "web:/releases/release/"
        section: "Targeting enhancements, Issues and PRs to Release Milestones > The Release Cycle"
      # v1.23+: "Kubernetes releases currently happen approximately three times per year."
      - document: "community:contributors/devel/sig-release/release.md"
