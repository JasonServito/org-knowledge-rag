# Golden set v0 (ADR-007 format). Drafted by an LLM on 2026-10-08 from the dev database; the
# author copies it into eval/golden_set/v0.yaml (human-owned) after the spot-check, and that
# copy is the golden set. Frozen once the dense baseline (S06-T6) runs; changes go into v1.
# Seeds q01-q20 are docs/research/corpus_validation_gate.md Appendix A; q21-q27 (SIG Release),
# q30-q36 (SIG Auth), q40-q47 (SIG Network) and q48 are new. Each label's comment quotes the
# stored text it rests on. Check it with `make eval-check` (EVAL_GOLDEN_PATH picks the file).
# Label rules (author decisions, 2026-10-08; S06-T5):
# - A-primary: label each fact's sources among the docs page (website or governance doc), the KEP,
#   the gate file, the release's CHANGELOG section (v1.X.Y >, never alpha/beta/rc copies) and
#   blog posts or sections about this topic. No pre-release copies, no passing mentions.
# - Release range: a source from outside release_window counts if it correctly describes the
#   asked-about period; at least one source stored inside the range is labeled where one exists.
# Verified 2026-10-08 by 3 independent LLM passes against the dev database (S06-T5); the
# author spot-checks a sample.
