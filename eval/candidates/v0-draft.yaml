  - id: q19
    question: Why did Kubernetes tighten validation of IP addresses and CIDRs in API fields?
    mode: WHY
    answerable: true
    expected_answer: >-
      Lax parsing accepted ambiguous strings (leading-zero IPv4 octets, IPv4-mapped IPv6,
      ambiguous CIDRs) that different components can read as different IPs, which can let values
      slip past IP-range checks (CVE-2021-29923). Go 1.17 changed its parsing to avoid that CVE,
