  - id: q17
    question: >-
      Before strict IP validation was on by default, what happened when a Service used an IPv4
      address with leading zeros?
    mode: HISTORY
    answerable: true
    expected_answer: >-
      It was accepted: Kubernetes kept allowing IPv4 leading zeros and read them as decimal
      (v1.23 notes, after Go 1.17 began rejecting them). Since v1.27 the API server also warned
      for Services (IPv4 leading zeros, non-canonical IPv6). Rejection came with
      StrictIPCIDRValidation on by default in v1.36.
    release_window: {until: "1.35"}
    smoke: false
    labels:
      # "Added warnings to the Services API. Kubernetes now warns for Services in the case of:
      # - IPv4 addresses with leading zeros"
      - document: changelog:1.27
        section: v1.27.0 > Changes by Kind > Deprecation
      # "(The IP/CIDR fields in Service have had these warnings since 1.27; they will be added to
      # other objects in the Alpha phase"
      - document: kep:4858
        section: "KEP-4858: IP/CIDR Validation Improvements > Proposal > API Warnings"
      # "Since golang 1.17 both net.ParseIP and net.ParseCIDR rejects leading zeros ... Kubernetes will
      # keep allowing leading zeros ... interprets leading zeros on IPv4 addresses as decimal"
      - document: changelog:1.23
        section: v1.23.0 > Changes by Kind > API Change
      # v1.33-v1.35 (gate off by default): "creating an object with such an invalid IP or CIDR value
      # will result in a warning"
      - document: "changelog:1.33"
        section: "v1.33.0 > Changes by Kind > API Change"
    # Seed source k/k pkg/api/service/warnings.go is not stored.
