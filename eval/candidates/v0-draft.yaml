  - id: q09
    question: Why was PodSecurityPolicy replaced instead of fixed?
    mode: WHY
    answerable: true
    expected_answer: >-
      Fixing PSP's usability problems needed breaking changes. Its authorization model (policies bound to the
      user or the pod's service account) was confusing and easy to over-grant, it failed closed with no
      dry-run/audit mode so it could never be on by default, and its API was inconsistent and unbounded.
    smoke: false
    labels:
      # "Policy authorization model ... Rollout challenges - PSP fails closed ... can never be enabled by default"
      - document: kep:2579
        section: "KEP-2579: Pod Security Admission Control > Motivation"
      # "The updates required to improve its usability would have introduced breaking changes"
      - document: changelog:1.25
        section: v1.25.0 > What's New (Major Themes) > PodSecurityPolicy is Removed, Pod Security Admission graduates to Stable
      # "serious usability problems that can't be addressed without making breaking changes"
      - document: web:/blog/2021/04/06/podsecuritypolicy-deprecation-past-present-and-future/
        section: Why is PodSecurityPolicy going away?
      # "Flawed authorization model ... Difficult to roll out - PSP fail-closed ... Inconsistent
      # unbounded API"
      - document: "web:/blog/2022/08/23/podsecuritypolicy-the-historical-context/"
        section: "The rise of Pod Security Admission"
      # "would have introduced breaking changes"
      - document: "web:/blog/2022/08/23/kubernetes-v1-25-release/"
        section: "What's New (Major Themes) > PodSecurityPolicy is removed; Pod Security Admission graduates to Stable"
      # "complex and often confusing usage necessitated changes, which unfortunately would have been
      # breaking changes"
      - document: "web:/blog/2022/08/04/upcoming-changes-in-kubernetes-1-25/"
