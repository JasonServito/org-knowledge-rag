  - id: q11
    question: What happens to unused auto-generated ServiceAccount token Secrets?
    mode: CURRENT
    answerable: true
    expected_answer: >-
      Since v1.29 the legacy token cleaner (kube-controller-manager) marks an auto-generated, unmounted token
      Secret invalid after it goes unused for a set period (default 1 year), adding the
      kubernetes.io/legacy-token-invalid-since label; if it stays unused for another period (default 1 year)
      it is deleted. The period is set with --legacy-service-account-token-clean-up-period.
    smoke: false
    labels:
      # "will be marked as invalid if they remain unused ... (set to default at one year) ... subsequently be purged"
      - document: web:/docs/reference/access-authn-authz/service-accounts-admin/
        section: Auto-generated legacy ServiceAccount token clean up
      # "If an invalid Secret is not used in a *specified amount of time*, the cleaner will delete it."
      - document: web:/docs/reference/access-authn-authz/service-accounts-admin/
        section: Control plane details > Legacy ServiceAccount token cleaner
      # "after the duration configured through `--legacy-service-account-token-clean-up-period` (one
      # year by default) ... finally deleted"
      - document: "kep:2799"
        section: "KEP-2799: Reduction of Secret-based Service Account Tokens > Design Details > LegacyServiceAccountTokenCleanUp"
      # "invalid if they have not been used for a long time (1 year by default) ... (1 additional
      # year by default)"
      - document: "web:/blog/2023/12/13/kubernetes-v1-29-release/"
        section: "Improvements that graduated to beta in Kubernetes v1.29 > Clean up for legacy Secret-based ServiceAccount tokens ([SIG Auth](https://github.com/kubernetes/community/tree/master/sig-auth))"
      # "auto-labeled with a `kubernetes.io/legacy-token-invalid-since` label ... (defaulting to one
      # year)"
      - document: "changelog:1.29"
        section: "v1.29.0 > Changes by Kind > Feature"
