  - id: q04
    question: Why did Kubernetes move to three releases per year?
    mode: WHY
    answerable: true
    expected_answer: >-
      The extended v1.19 cycle (COVID-19) left only three releases in 2020 and people asked
      for a predictable cadence; most organizations could not keep up with an upgrade every
      3 months; fewer releases mean less upgrade churn for users, longer support per release,
      more time to mature enhancements, and less overhead for SIG Release.
    smoke: true
    labels:
      # "The extended release schedule for 1.19 resulted in only three minor Kubernetes releases for 2020."
      # Reduce risk: "most organizations cannot keep up with regularly making a minor version update every 3 months"
      - document: kep:2572
        section: "KEP-2572: Defining the Kubernetes Release Cadence > Motivation"
      # "consumers and integrators will get longer support terms" / "the management overhead for SIG Release ... diminishes"
      - document: web:/blog/2021/07/20/new-kubernetes-release-cadence/
        section: Why we decided to change the release cadence
      # "end user organizations will spend less time on upgrades"
      - document: "web:/blog/2021/07/20/new-kubernetes-release-cadence/"
        section: "What this means for end users"
      # End User: "Most end user organizations find it difficult to match Kubernetes release
      # cadence"; SIG Release: "reduced management overhead"
      - document: "kep:2572"
        section: "KEP-2572: Defining the Kubernetes Release Cadence > Proposal > User Stories"
