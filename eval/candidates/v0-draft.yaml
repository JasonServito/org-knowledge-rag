  - id: q14
    question: Why did Kubernetes stop auto-generating Secret-based ServiceAccount tokens?
    mode: WHY
    answerable: true
    expected_answer: >-
      With bound service account token volumes GA in v1.22, pods get tokens from the TokenRequest API via a
      projected volume, so auto-generated Secret tokens were no longer needed; they are less secure than bound
      tokens (not audience- or time-bound, and stored in Secrets that widen the attack surface).
    smoke: true
    labels:
      # "BoundServiceAccountTokenVolume is GA in 1.22 ... secret-based service account tokens which are less secure"
      - document: kep:2799
        section: "KEP-2799: Reduction of Secret-based Service Account Tokens > Motivation"
      # "JWTs are not audience bound ... storing the service account token in a Secret ... broad attack surface"
      - document: kep:1205
        section: Bound Service Account Tokens > Background
      # "These tokens don't expire and don't rotate ... risks associated with static, long-lived
      # credentials"
      - document: "web:/docs/concepts/security/service-accounts/"
        section: "How to use service accounts > Assign a ServiceAccount to a Pod > Manually retrieve ServiceAccount credentials"
      # "switched to using more secure service account tokens, which were time-limited and bound to
      # specific pods by 1.22"
      - document: "web:/blog/2023/12/13/kubernetes-v1-29-release/"
        section: "Improvements that graduated to beta in Kubernetes v1.29 > Clean up for legacy Secret-based ServiceAccount tokens ([SIG Auth](https://github.com/kubernetes/community/tree/master/sig-auth))"
