      # Stages list "stage: beta / defaultValue: true / fromVersion: '1.36'"; "octets within IPv4
      # addresses are not allowed to have any leading `0`s".
      - document: gate:StrictIPCIDRValidation
      # "2026-04-22: Beta in Kubernetes v1.36"
      - document: "kep:4858"
        section: "KEP-4858: IP/CIDR Validation Improvements > Implementation History"
      # Beta: "Updated validation available behind a feature gate, enabled by default."
      - document: "kep:4858"
        section: "KEP-4858: IP/CIDR Validation Improvements > Design Details > Graduation Criteria > Beta"
      # "The updated validation will reject IPv4 IPs with leading "0"s"
      - document: "kep:4858"
        section: "KEP-4858: IP/CIDR Validation Improvements > Proposal > Updated IP/CIDR validity criteria"
